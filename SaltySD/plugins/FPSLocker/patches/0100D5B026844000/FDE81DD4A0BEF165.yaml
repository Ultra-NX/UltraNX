# Silver Pines 1.0.2
# BID: FDE81DD4A0BEF165

ALL_FPS:
  # Vsync
  # Ref: 01 00 00 00 01 00 00 00 00 00 00 08
  -
    type: evaluate_write
    address: [MAIN, 0x4CE53D8]
    value_type: int32
    value: VSYNC_TARGET
  # FPS lock
  # Ref: 89 88 88 3C 03 00 00 00
  -
    type: evaluate_write
    address: [MAIN, 0x4CE53E4]
    value_type: float
    value: "1 / FPS_LOCK_TARGET"
  # DynamicResolution_TypeInfo
  -
    type: evaluate_write
    address: [MAIN, 0x4A8E9C0, 0xB8, 0]
    address_unsafe: true
    value_type: double
    value: [FPS_TARGET, FRAMETIME_TARGET]
