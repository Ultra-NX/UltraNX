    [mov, x0, 0xb4d0],
    [movk, x0, 0x321, 16],
    [add, x0, x16, x0],
    [ldr, x0, [x0]],
    [ldr, x0, [x0]],
    [cbz, x0, :n],
    [ldrb, w9, [x0, 0x9f2]],
    [cmp, w9, w1],
    [b.eq, :n],
    [mov, x9, 0x47f8],
    [movk, x9, 0x10c, 16],
    [add, x9, x16, x9],
    [blr, x9],
    :n,
    [ldp, x0, x16, [sp]],
