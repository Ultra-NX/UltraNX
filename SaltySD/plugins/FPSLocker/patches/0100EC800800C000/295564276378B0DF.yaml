# NARUTO SHIPPUDEN: Ultimate Ninja STORM TRILOGY 1.0.1
# BID: 295564276378B0DF
# Storm 1, 2 and 3: FPS-independent game speed (frame skip): set any FPS target (20-60), FPS can be changed in-game.
# Logic runs in the game's 60 FPS mode (60 steps/s); missing steps are run before each drawn frame.
# STORM 1 free roam (and STORM 1 with an FPS target of 30 or less) uses the game's own 30 FPS mode when the console is too slow for its 60 FPS mode;
# the mode is chosen only when a STORM 1 game mode starts. The launcher also runs at 60 FPS.
# Resolution unchanged (EdiZon cheats). Frame skip state is kept in DECLARATIONS variables.

DECLARATIONS:
# gameId = running game (0 launcher, 1-3 STORM 1-3), fpsTgt = FPSLocker FPS target, lAvg = average logic step time, mHold = frames since the last mode change, fAvg = average frame time;
# frame skip state: R = logic steps left, tick/acc = time, Step = logic step counter, tStep0 = start of the current logic step
- type: variable
  name: fsR
  value_type: uint32
  default_value: 0
- type: variable
  name: fsTick
  value_type: uint64
  default_value: 0
- type: variable
  name: fsAcc
  value_type: int64
  default_value: 0
- type: variable
  name: fsStep
  value_type: uint32
  default_value: 0
- type: variable
  name: tStep0
  value_type: uint64
  default_value: 0
- type: variable
  name: gameId
  value_type: uint32
  default_value: 0
- type: variable
  name: fpsTgt
  value_type: uint32
  default_value: 60
  evaluate: "FPS_TARGET"
- type: variable
  name: lAvg
  value_type: int64
  default_value: 0
- type: variable
  name: mHold
  value_type: uint32
  default_value: 0
- type: variable
  name: fAvg
  value_type: int64
  default_value: 0
- type: variable
  name: rpgStamp
  value_type: uint32
  default_value: 0
- type: variable
  name: rpgSlow
  value_type: uint32
  default_value: 1
- type: variable
  name: rpgN
  value_type: uint32
  default_value: 0
- type: variable
  name: rpgNSlow
  value_type: uint32
  default_value: 0
# frame start: measure time, decide how many logic steps to run (step = 1/60 s in the 60 FPS mode, 1/30 s in the 30 FPS mode); STORM 1 free roam: count frames slower than its FPS mode allows
- type: code
  name: fsStart
  instructions: [
    [mov, x16, 0xaa00],
    [movk, x16, 0x117, 16],
    [sub, x16, x30, x16],
    [adrp, x17, $fsR],
    [ldr, w9, [x17, $fsStep]],
    [add, w9, w9, 1],
    [str, w9, [x17, $fsStep]],
    [ldr, w9, [x17, $gameId]],
    [cmp, w9, 1],
    [b.ne, :nl],
    [ldr, w9, [x17, $fsStep]],
    [ldr, w10, [x17, $rpgStamp]],
    [sub, w9, w9, w10],
    [cmp, w9, 4],
    [b.hi, :nl],
    [ldr, w9, [x17, $mHold]],
    [add, w9, w9, 1],
    [str, w9, [x17, $mHold]],
    [cmp, w9, 120],
    [b.lo, :nl],
    [mov, x0, 0xb4d0],
    [movk, x0, 0x321, 16],
    [add, x0, x16, x0],
    [ldr, x0, [x0]],
    [ldr, x0, [x0]],
    [cbz, x0, :nl],
    [ldrb, w10, [x0, 0x9f2]],
    [ldr, w9, [x17, $rpgN]],
    [add, w9, w9, 1],
    [str, w9, [x17, $rpgN]],
    [cmp, w10, 60],
    [b.ne, :l30],
    [ldr, x9, [x17, $fAvg]],
    [mov, x11, 0xc400],
    [movk, x11, 0x9, 16],
    [cmp, x9, x11],
    [b.le, :nl],
    [b, :slow],
    :l30,
    [ldr, x9, [x17, $lAvg]],
    [mov, x11, 0xfb00],
    [movk, x11, 0x4, 16],
    [cmp, x9, x11],
    [b.lt, :nl],
    :slow,
    [ldr, w9, [x17, $rpgNSlow]],
    [add, w9, w9, 1],
    [str, w9, [x17, $rpgNSlow]],
    :nl,
    [stp, x16, x30, [sp, -0x10], "!"],
    [mov, x9, 0x2ba8],
    [movk, x9, 0x16a, 16],
    [add, x9, x16, x9],
    [blr, x9],
    [ldp, x16, x30, [sp]],
    [add, sp, sp, 0x10],
    [adrp, x17, $fsR],
    [mov, w15, 0],
    [str, x0, [x17, $tStep0]],
    [mov, x10, x0],
    [ldr, x11, [x17, $fsTick]],
    [str, x10, [x17, $fsTick]],
    [cbz, x11, :one],
    [sub, x11, x10, x11],
    [ldr, x9, [x17, $fAvg]],
    [sub, x13, x11, x9],
    [mov, x14, 0x4c00],
    [movk, x14, 0x1d, 16],
    [cmp, x13, x14],
    [csel, x13, x13, x14, lt],
    [mov, x14, 16],
    [sdiv, x13, x13, x14],
    [add, x9, x9, x13],
    [str, x9, [x17, $fAvg]],
    [ldr, x12, [x17, $fsAcc]],
    [add, x12, x12, x11],
    [mov, x9, 0xb4d0],
    [movk, x9, 0x321, 16],
    [add, x9, x16, x9],
    [ldr, x9, [x9]],
    [ldr, x9, [x9]],
    [cbz, x9, :one],
    [ldrb, w9, [x9, 0x9f2]],
    [cmp, w9, 60],
    [b.eq, :q60],
    [cmp, w9, 30],
    [b.ne, :one],
    [mov, x9, 0xc400],
    [movk, x9, 0x9, 16],
    [b, :q],
    :q60,
    [mov, x9, 0xe200],
    [movk, x9, 0x4, 16],
    :q,
    [sdiv, x10, x12, x9],
    [cmp, x10, 1],
    [b.ge, :c1],
    [mov, x10, 1],
    :c1,
    [cmp, x10, 4],
    [b.le, :ok],
    [mov, x10, 4],
    [mov, x12, 0],
    [b, :store],
    :ok,
    [mul, x13, x10, x9],
    [sub, x12, x12, x13],
    [mov, x13, 0],
    [sub, x13, x13, x9],
    [cmp, x12, x13],
    [csel, x12, x12, x13, ge],
    :store,
    [str, x12, [x17, $fsAcc]],
    [sub, w10, w10, 1],
    [str, w10, [x17, $fsR]],
    [ret],
    :one,
    [str, x15, [x17, $fsAcc]],
    [str, w15, [x17, $fsR]],
    [ret]
  ]
