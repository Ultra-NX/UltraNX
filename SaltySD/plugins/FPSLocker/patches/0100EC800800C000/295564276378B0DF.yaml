# UI text (ccUiFont / STORM 3 ccUiFontApp): its command list is rebuilt every logic step and cleared only after it was drawn; with several logic steps per frame the text was drawn 2-4 times (bolder, flickering at 35-55 FPS). Clear it also when the last commands were added in an earlier logic step (flag = 0x8000xxxx, xxxx = logic step)
- type: code
  name: uiFontNeedClear
  instructions: [
    [adrp, x17, $fsR],
    [ldr, w16, [x17, $fsStep]],
    [movk, w16, 0x8000, 16],
    [ldr, w8, [x19, 0xb0]],
    [cmp, w8, 1],
    [b.eq, :yes],
    [tbz, w8, 31, :no],
    [cmp, w8, w16],
    [b.eq, :no],
    :yes,
    [mov, w8, 1],
    [ret],
    :no,
    [str, w16, [x19, 0xb0]],
    [mov, w8, 0],
    [ret]
  ]
