# NARUTO SHIPPUDEN: Ultimate Ninja STORM 4 ROAD TO BORUTO 1.3.0
# BID: D3016FC0C0402DFB
# FPS-independent game speed (frame skip): set any FPS target (20-60), FPS can be changed in-game.
