MASTER_WRITE:
  # NOP 30 fps restore
  -
    type: asm_a64
    main_offset: 0xEEB634
    instructions: [
      [ret]
    ]
  # SetFrameRate
  -
    type: asm_a64
    main_offset: 0xEEB688
    instructions: [
      [adrp, x8, 0x3016000],
      [ldr, x8, [x8, 0x990]],
      [ldr, s0, [x8, 0x20]],
      [ret]
    ]
  # NOP 30 fps restore
  -
    type: asm_a64
    main_offset: 0xEEB7D4
    instructions: [
      [ret]
    ]

