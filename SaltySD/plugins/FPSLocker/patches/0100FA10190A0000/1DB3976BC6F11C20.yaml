# logic runs in 60 FPS mode (was BL to the FPS setting getter)
- type: asm_a64
  main_offset: 0x886DC0
  instructions: [[mov, w0, 60]]
# frame start (was BL to an empty function)
- type: asm_a64
  main_offset: 0xE302DC
