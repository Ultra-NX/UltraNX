# NARUTO X BORUTO ナルティメットストームコネクションズ 1.7.1
# BID: 1DB3976BC6F11C20
# FPS-independent game speed (frame skip): set any FPS target (20-60), FPS can be changed in-game.
# Logic always runs 60 steps/s; missing steps are run before each drawn frame.
# Movies play in the game's own 30 FPS mode (its movie playback flickers in the 60 FPS mode).
# Frame skip state is kept in DECLARATIONS variables.

DECLARATIONS:
# frame skip state: F = repeated logic step, R = logic steps left, tick/acc = time, Saved/save* = hidden button edges, Step = logic step counter, Press = press delivered in this step;
# mvStamp = logic step of the last movie scene update, mvForced = the game was switched to its 30 FPS mode for a movie
- type: variable
  name: fsF
  value_type: uint32
  default_value: 0
- type: variable
  name: fsR
  value_type: uint32
  default_value: 0
- type: variable
  name: fsTick
  value_type: uint64
  default_value: 0
- type: variable
  name: fsAcc
  value_type: int64
  default_value: 0
- type: variable
  name: fsSaved
  value_type: uint32
  default_value: 0
- type: variable
  name: fsStep
  value_type: uint32
  default_value: 0
- type: variable
  name: fsPress
  value_type: uint32
  default_value: 0
- type: variable
  name: mvStamp
  value_type: uint32
  default_value: 4026531840
