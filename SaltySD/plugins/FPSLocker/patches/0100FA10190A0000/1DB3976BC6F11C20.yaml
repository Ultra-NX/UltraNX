# after logic tasks (was LDR X0, [X19, 0x58])
- type: asm_a64
  main_offset: 0xE302A0
  instructions: [[bl, _afterLogic()]]
# layer job wait task (was MOV W1, WZR; B 0x11C1D7C)
- type: asm_a64
  main_offset: 0x8794D8
  instructions: [[mov, x16, x30], [bl, _layerWaitGate()]]
# ParticleDefferedRendering (was ADRP X20, 0x2144000)
- type: asm_a64
  main_offset: 0x880060
  instructions: [[bl, _pdrGate()]]
# Scaleform movies: dt = max(real dt, 1/30) in a frame with a button press (fixes button polling)
- type: asm_a64
  main_offset: 0x96D2CC
  instructions: [[bl, _flashDt()], [fmov, s1, w9]]
# FMAXNM is not supported by asm_a64
- type: bytes
  main_offset: 0x96D2D4
