  value: 0x1E216900 # fmaxnm s0, s8, s1
- type: asm_a64
  main_offset: 0x96D2D8
  instructions: [[ldr, x8, [x8, 0xc8]], [blr, x8], [nop]]
# particle delete request: queue push (was LDP X9, X8, [X19, 0xE8])
- type: asm_a64
  main_offset: 0x11E4FEC
  instructions: [[bl, _deleteQueueOnce()]]
# movie draw task (was ADRP X0, 0x2149000; LDR X0, [X0, 0x578])
- type: asm_a64
  main_offset: 0x4DD260
  instructions: [[mov, x16, x30], [bl, _movieStamp()]]
