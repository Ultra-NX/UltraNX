# layer job wait: only in the first logic step of a frame (the layer threads are started only with drawing)
- type: code
  name: layerWaitGate
  instructions: [
    [adrp, x17, $fsF],
    [ldr, w9, [x17, $fsF]],
    [cbnz, w9, :skip],
    [mov, w1, 0],
    [mov, x10, 0x94e0],
    [movk, x10, 0x87, 16],
    [sub, x10, x30, x10],
    [mov, x9, 0x1d7c],
    [movk, x9, 0x11c, 16],
    [add, x9, x10, x9],
    [mov, x30, x16],
    [br, x9],
    :skip,
    [mov, x30, x16],
    [ret]
  ]
# ParticleDefferedRendering task: run only in the last logic step
- type: code
  name: pdrGate
  instructions: [
    [adrp, x17, $fsF],
    [ldr, w9, [x17, $fsR]],
    [cbnz, w9, :skip],
    [mov, x16, 0x64],
    [movk, x16, 0x88, 16],
    [sub, x16, x30, x16],
    [mov, x20, 0x4000],
    [movk, x20, 0x214, 16],
    [add, x20, x16, x20],
    [ret],
    :skip,
    [ldp, x20, x19, [sp, 0x10]],
    [ldp, x30, x21, [sp]],
    [add, sp, sp, 0x20],
    [ret]
  ]
# Scaleform Advance: set its arguments and return the minimum dt (1/30 s) in a frame that delivers a button press
- type: code
  name: flashDt
  instructions: [
    [adrp, x17, $fsF],
    [mov, w9, 0],
    [ldr, w10, [x17, $fsPress]],
    [cbz, w10, :o],
    [movk, w9, 0x8889, 0],
    [movk, w9, 0x3d08, 16],
    :o,
    [mov, x0, x22],
    [mov, w1, 1],
    [mov, w2, 1],
    [ret]
  ]
# particle delete queue: do not queue the same effect twice (several logic steps run before one queue flush)
- type: code
  name: deleteQueueOnce
  instructions: [
    [ldp, x10, x11, [x19, 0xe0]],
    :l,
    [cmp, x10, x11],
    [b.eq, :push],
    [ldr, x12, [x10, 0x8]],
    [cmp, x12, x20],
    [b.eq, :dup],
    [add, x10, x10, 0x10],
    [b, :l],
    :push,
    [ldp, x9, x8, [x19, 0xe8]],
    [ret],
    :dup,
    [add, x30, x30, 0x130],
    [ret]
  ]
# movie draw task (exists only while a movie plays): remember the logic step
- type: code
  name: movieStamp
  instructions: [
    [adrp, x17, $fsF],
    [ldr, w9, [x17, $fsStep]],
    [str, w9, [x17, $mvStamp]],
    [mov, x9, x30],
    [mov, x30, x16],
    [mov, x10, 0xc310],
    [movk, x10, 0x1c6, 16],
    [add, x10, x9, x10],
    [ldr, x0, [x10]],
    [br, x9]
  ]

